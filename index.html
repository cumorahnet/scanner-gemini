<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escáner de Imágenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .container-main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card-custom {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 20px rgba(15,23,42,0.08);
        }

        .form-control, .form-select {
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            border-radius: 14px;
            border: 2px solid #f1f5f9;
            background: #fff;
            color: var(--primary);
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
            outline: none;
        }

        .btn-primary {
            background: var(--accent);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            color: white;
        }

        .btn-success {
            background: var(--success);
            border: none;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            color: white;
        }

        .btn-outline-secondary {
            border: 1px solid #e2e8f0;
            color: var(--primary);
        }

        .btn-outline-secondary:hover {
            background: #f1f5f9;
        }

        #output-area {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 15px;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #0f172a;
        }

        #output-area.empty {
            color: #94a3b8;
            font-style: italic;
        }

        .scan-result-item {
            background: white;
            border-left: 4px solid var(--accent);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* SCANNER MODAL */
        #ia-modal {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: none;
            flex-direction: column;
        }

        #cam-preview-ia {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 82%;
            aspect-ratio: 4/3;
            border: 2px solid rgba(0,229,192,0.6);
            border-radius: 16px;
            pointer-events: none;
            z-index: 20;
        }

        .scan-guide::before, .scan-guide::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: #00e5c0;
            border-style: solid;
        }

        .scan-guide::before {
            top: -2px;
            left: -2px;
            border-width: 3px 0 0 3px;
            border-radius: 4px 0 0 0;
        }

        .scan-guide::after {
            bottom: -2px;
            right: -2px;
            border-width: 0 3px 3px 0;
            border-radius: 0 0 4px 0;
        }

        #cam-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 40px 18px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #snap-btn {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: white;
            border: 5px solid rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        #snap-btn:hover {
            background: #f0f0f0;
        }

        /* RESULT MODAL */
        #result-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 20000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 16px;
        }

        #result-panel {
            background: white;
            border-radius: 24px;
            padding: 22px;
            width: 100%;
            max-width: 420px;
        }

        .toast-msg {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30000;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.8rem;
            display: none;
            color: white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            max-width: 88%;
            text-align: center;
        }

        /* API KEY MODAL */
        #key-config-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            z-index: 25000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        label.text-uppercase {
            font-size: 0.65rem;
            margin-bottom: 4px;
            font-weight: 800;
            color: #94a3b8;
            display: block;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="toast-msg" class="toast-msg"></div>

<!-- API KEY MODAL -->
<div id="key-config-modal">
    <div class="card-custom" style="max-width:350px; text-align:center;">
        <h6 class="fw-bold mb-3">⚙ CONFIGURAR ESCÁNER</h6>
        <p style="font-size:0.7rem;" class="text-muted mb-3">
            Ingresa tu API Key de Google Gemini.<br>Se guarda solo en este dispositivo.<br><br>
            Obtén la tuya gratis en<br>
            <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--accent);">aistudio.google.com/app/apikey</a>
        </p>
        <input type="password" id="user-gemini-key" class="form-control mb-3" placeholder="AIzaSy...">
        <button class="btn btn-primary w-100 rounded-pill fw-bold" onclick="saveGeminiKey()">GUARDAR KEY</button>
    </div>
</div>

<!-- RESULT MODAL -->
<div id="result-modal">
    <div id="result-panel">
        <p class="fw-bold mb-3" style="font-size:0.7rem; color:#94a3b8; letter-spacing:1px;">TEXTO EXTRAÍDO</p>
        <textarea id="result-text" class="form-control mb-3" rows="6" readonly style="resize:none; font-family:'Courier New',monospace;"></textarea>
        <button class="btn btn-success w-100 rounded-pill fw-bold mb-2" onclick="copyResultText()">
            <i class="fas fa-copy me-2"></i>COPIAR TEXTO
        </button>
        <button class="btn btn-primary w-100 rounded-pill fw-bold mb-2" onclick="addToOutput()">
            <i class="fas fa-plus me-2"></i>AGREGAR AL HISTORIAL
        </button>
        <button class="btn btn-outline-secondary w-100 rounded-pill" onclick="closeResult()" style="border:none;">
            ✕ CERRAR
        </button>
    </div>
</div>

<!-- SCANNER MODAL -->
<div id="ia-modal">
    <video id="cam-preview-ia" autoplay playsinline muted></video>
    <div class="scan-guide"></div>
    <div id="cam-top-bar">
        <button class="btn btn-sm rounded-pill" style="background:rgba(0,0,0,0.5); color:white; border:1px solid rgba(255,255,255,0.3);" onclick="closeScanner()">✕ SALIR</button>
        <button class="btn btn-sm rounded-pill" style="background:rgba(0,0,0,0.5); color:#fbbf24; border:1px solid rgba(255,255,255,0.2); font-size:0.65rem;" onclick="changeGeminiKey()">⚙ API KEY</button>
    </div>
    <div id="snap-btn" onclick="captureIA()">
        <i class="fas fa-camera fa-2x text-primary" id="snap-icon"></i>
    </div>
</div>

<!-- MAIN INTERFACE -->
<div class="container-main">
    <div class="card-custom">
        <h5 class="fw-bold mb-4 text-center" style="color:var(--primary);">
            <i class="fas fa-image me-2" style="color:var(--accent);"></i>Escáner de Imágenes
        </h5>
        <button class="btn btn-primary w-100 py-3 rounded-pill fw-bold mb-3" onclick="openScannerModal()">
            <i class="fas fa-camera me-2"></i>ABRIR ESCÁNER
        </button>
    </div>

    <div class="card-custom">
        <h6 class="fw-bold mb-3" style="color:var(--primary);">Historial de Escaneos</h6>
        <div id="output-area" class="empty">
            Aquí aparecerá el texto de tus escaneos...
        </div>
        <button class="btn btn-outline-secondary w-100 rounded-pill mt-3" onclick="clearOutput()">
            <i class="fas fa-trash me-2"></i>LIMPIAR HISTORIAL
        </button>
    </div>
</div>


<script>
/* ══════════════════════════════════════════════════════════════════
   ESTADO GLOBAL
══════════════════════════════════════════════════════════════════ */
let scannerStream = null;
let pendingScannedText = '';
let pendingCanvas = null;
let outputArray = [];

/* ══════════════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════════════ */
const showToast = (msg, color = '#10b981') => {
    const el = document.getElementById('toast-msg');
    el.textContent = msg;
    el.style.background = color;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.style.display = 'none', 3000);
};

/* ══════════════════════════════════════════════════════════════════
   API KEY MANAGEMENT
══════════════════════════════════════════════════════════════════ */
function saveGeminiKey() {
    const val = document.getElementById('user-gemini-key').value.trim();
    if (val && val.length > 10) {
        localStorage.setItem('yaute_key_v3310', val);
        document.getElementById('key-config-modal').style.display = 'none';
        showToast('✅ Key guardada correctamente');
    } else {
        showToast('⚠ Key inválida', '#ef4444');
    }
}

function changeGeminiKey() {
    document.getElementById('user-gemini-key').value = localStorage.getItem('yaute_key_v3310') || '';
    document.getElementById('key-config-modal').style.display = 'flex';
}

function checkApiKey() {
    if (!localStorage.getItem('yaute_key_v3310')) {
        document.getElementById('key-config-modal').style.display = 'flex';
        return false;
    }
    return true;
}

/* ══════════════════════════════════════════════════════════════════
   SCANNER CAMERA
══════════════════════════════════════════════════════════════════ */
async function openScannerModal() {
    if (!checkApiKey()) return;
    document.getElementById('ia-modal').style.display = 'flex';
    try {
        scannerStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        document.getElementById('cam-preview-ia').srcObject = scannerStream;
    } catch(e) {
        showToast('❌ Error de cámara: ' + e.message, '#ef4444');
        closeScanner();
    }
}

function closeScanner() {
    if (scannerStream) scannerStream.getTracks().forEach(t => t.stop());
    scannerStream = null;
    document.getElementById('ia-modal').style.display = 'none';
}

/* ══════════════════════════════════════════════════════════════════
   CAPTURE AND ORIENTATION CORRECTION
══════════════════════════════════════════════════════════════════ */
function captureOrientado(video) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');

    if (vh >= vw) {
        // Ya es portrait
        c.width = vw;
        c.height = vh;
        ctx.drawImage(video, 0, 0);
    } else {
        // Landscape → rotar 90° a portrait
        c.width = vh;
        c.height = vw;
        ctx.translate(c.width / 2, c.height / 2);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(video, -vw / 2, -vh / 2, vw, vh);
    }
    return c;
}

/* ══════════════════════════════════════════════════════════════════
   CAPTURE + GEMINI OCR
══════════════════════════════════════════════════════════════════ */
async function captureIA() {
    const key = localStorage.getItem('yaute_key_v3310');
    if (!key) {
        changeGeminiKey();
        return;
    }

    const video = document.getElementById('cam-preview-ia');
    if (!video.srcObject || video.videoWidth === 0) {
        showToast('⚠ Cámara no lista', '#f59e0b');
        return;
    }

    pendingCanvas = captureOrientado(video);
    const b64 = pendingCanvas.toDataURL('image/jpeg', 0.88).split(',')[1];

    const snapIcon = document.getElementById('snap-icon');
    snapIcon.className = 'fas fa-spinner fa-spin fa-2x text-primary';
    document.getElementById('snap-btn').style.pointerEvents = 'none';

    try {
        const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${key}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { inline_data: { mime_type: 'image/jpeg', data: b64 } },
                            { text: 'Extrae TODO el texto visible en esta imagen. Presenta el resultado de forma clara y legible.' }
                        ]
                    }],
                    generationConfig: { temperature: 0.3, maxOutputTokens: 1000 }
                })
            }
        );

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);

        pendingScannedText = data.candidates[0].content.parts[0].text.trim();
        
        closeScanner();
        showResultModal();

    } catch(e) {
        showToast('❌ Error IA: ' + e.message, '#ef4444');
    } finally {
        snapIcon.className = 'fas fa-camera fa-2x text-primary';
        document.getElementById('snap-btn').style.pointerEvents = 'auto';
    }
}

/* ══════════════════════════════════════════════════════════════════
   RESULT MODAL
══════════════════════════════════════════════════════════════════ */
function showResultModal() {
    document.getElementById('result-text').value = pendingScannedText;
    document.getElementById('result-modal').style.display = 'flex';
}

function closeResult() {
    document.getElementById('result-modal').style.display = 'none';
    pendingScannedText = '';
    pendingCanvas = null;
}

function copyResultText() {
    const text = document.getElementById('result-text').value;
    navigator.clipboard.writeText(text).then(() => {
        showToast('✅ Texto copiado');
    }).catch(() => {
        showToast('⚠ No se pudo copiar', '#f59e0b');
    });
}

function addToOutput() {
    const text = document.getElementById('result-text').value;
    if (!text.trim()) {
        showToast('⚠ Texto vacío', '#f59e0b');
        return;
    }

    outputArray.push({
        timestamp: new Date().toLocaleString(),
        text: text
    });

    updateOutput();
    showToast('✅ Agregado al historial');
    closeResult();
}

/* ══════════════════════════════════════════════════════════════════
   OUTPUT MANAGEMENT
══════════════════════════════════════════════════════════════════ */
function updateOutput() {
    const outputArea = document.getElementById('output-area');
    
    if (outputArray.length === 0) {
        outputArea.innerHTML = '';
        outputArea.className = 'empty';
        outputArea.textContent = 'Aquí aparecerá el texto de tus escaneos...';
        return;
    }

    outputArea.className = '';
    outputArea.innerHTML = outputArray.map((item, idx) => `
        <div class="scan-result-item">
            <div style="color:#94a3b8; font-size:0.75rem; margin-bottom:8px;">
                <strong>#${idx + 1}</strong> — ${item.timestamp}
            </div>
            <div style="color:#0f172a; white-space:pre-wrap; word-break:break-word;">
                ${item.text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
            </div>
        </div>
    `).join('');
}

function clearOutput() {
    if (outputArray.length === 0) {
        showToast('⚠ Historial vacío', '#f59e0b');
        return;
    }
    if (confirm('¿Deseas borrar todo el historial de escaneos?')) {
        outputArray = [];
        updateOutput();
        showToast('✅ Historial limpiado');
    }
}

/* ══════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════ */
window.onload = () => {
    checkApiKey();
};
</script>
</body>
</html>
